[tools]
rust = { version = "nightly-2026-07-11", profile = "default", components = "rustfmt,clippy" }
taplo = "latest"
python = "latest"
uv = "latest"
"github:silitics/sidex" = "0.5.0"

[tasks.check]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Lint and check formatting."
run = "bash \"{{config_root}}/scripts/check.sh\""

[tasks.fmt]
description = "Format all files."
run = "bash scripts/fmt.sh"

[tasks.fix]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Auto-fix lint findings, then format."
run = "bash \"{{config_root}}/scripts/fix.sh\""

[tasks.doc]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Generate Rust documentation."
run = "cargo doc --all-features --document-private-items"

[tasks.test]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run tests."
run = "cargo test"

[tasks.generate]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Regenerate JSON schemas and OpenAPI spec."
run = "bash scripts/generate-api.sh \"$@\""

[tasks.build]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Build release binaries. Defaults to the host target."
usage = '''
arg "[target]" default="" help="Build target triple (defaults to host)"
flag "--cross" help="Use cross instead of cargo (for cross-compilation)"
'''
run = "bash scripts/build-binaries.sh \"$usage_target\" \"${usage_cross:-false}\""

[tasks."run-cli"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run Nexigon CLI. Forward args after `--`."
run = 'cargo run --bin nexigon-cli -- "$@"'

[tasks."run-agent"]
shell = "nix develop \"{{config_root}}\" --command bash -euo pipefail -c"
description = "Run Nexigon Agent. Forward args after `--`."
run = 'cargo run --bin nexigon-agent -- "$@"'
