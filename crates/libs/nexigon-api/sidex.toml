[bundle]
name = "nexigon_api"
version = "1"
description = "API definitions for Nexigon Hub."
authors = ["Silitics GmbH <info@silitics.com>"]

[backend.json-schema]

[backend.rust]
derive = ["Clone", "Debug"]
plugins = ["builder", "serde", "validate"]

[backend.rust.plugin.serde]
sidex_serde_path = "::sidex_serde"

[backend.rust.plugin.validate]
sidex_validate_path = "::sidex_validate"

[backend.ts]
plugins = ["validate"]
