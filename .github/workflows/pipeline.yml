# spellchecker:ignore taiki dtolnay Taplo xvzf musleabihf gnueabihf msvc clippy bindgen

name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Download link for the `cross` binary to use.
  CROSS_URL: https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Run Checks
        run: mise run check

  test:
    name: Test
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Run Tests
        run: mise exec rust@stable -- cargo test
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          # FIXME: Fails to compile due to `aws-lc-rs` missing bindgen.
          # - os: ubuntu-latest
          #   target: arm-unknown-linux-musleabihf
          #   cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: true
          # FIXME: Fails to compile due to `aws-lc-rs` missing bindgen.
          # - os: ubuntu-latest
          #   target: arm-unknown-linux-gnueabihf
          #   cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install target for native builds
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: mise exec rust@stable -- rustup target add "$BUILD_TARGET" --toolchain stable
      - name: Install Cross
        if: ${{ matrix.cross }}
        run: curl -s -L "$CROSS_URL" | tar xvzf - -C /usr/local/bin
      - name: Determine Version
        shell: bash
        run: echo "NEXIGON_GIT_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - name: Run Build
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_CROSS: ${{ matrix.cross }}
        run: mise exec rust@stable -- bash scripts/build-binaries.sh "$BUILD_TARGET" "${BUILD_CROSS:-false}"
      - name: Upload Binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries/${{ matrix.target }}.tar.gz
          if-no-files-found: error
  upload:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Download Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: build/binaries
          merge-multiple: true
      - name: Upload Binaries
        env:
          NEXIGON_TOKEN: ${{ secrets.NEXIGON_TOKEN }}
          NEXIGON_HUB_URL: ${{ secrets.NEXIGON_HUB_URL }}
        run: |
          tar -xvf build/binaries/x86_64-unknown-linux-gnu.tar.gz nexigon-cli
          export NEXIGON_CLI="./nexigon-cli"
          cat <<EOF >.nexigon-cli.toml
            hub-url = "$NEXIGON_HUB_URL"
            token = "$NEXIGON_TOKEN"
          EOF
          ./scripts/upload-binaries.sh
  build_debs:
    name: Build Debian Packages (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Download Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries
      - name: Extract Binaries
        run: |
          set -euo pipefail
          cd build/binaries
          mkdir -p ${{ matrix.target }}
          tar -xzf ${{ matrix.target }}.tar.gz -C ${{ matrix.target }}
          rm -f ${{ matrix.target }}.tar.gz
      - name: Build Debian Packages
        run: ./scripts/build-debs.sh ${{ matrix.target }}
      - name: Upload Debian Packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs-${{ matrix.target }}
          path: build/debs/*.deb
          if-no-files-found: error
  build_source_package:
    name: Build Debian Source Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Build Source Package
        run: ./scripts/build-source-package.sh
      - name: Upload Source Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-package
          path: build/source/*
          if-no-files-found: error
  release_assets:
    name: Create Release
    needs:
      - build
      - build_debs
      - build_source_package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install cargo-cyclonedx
        run: mise exec rust@stable -- cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Download Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: build/binaries
          merge-multiple: true
      - name: Download Debian Packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debs-*
          path: build/debs
          merge-multiple: true
      - name: Download Source Package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-package
          path: build/source
      - name: Prepare Release Assets
        run: |
          mkdir -p build/release
          cp build/binaries/* build/debs/* build/source/* build/release/
          mise exec rust@stable -- bash scripts/prepare-release-assets.sh build/release
          find build/release -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="releases/$TAG.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" \
              --verify-tag \
              --latest \
              --title "Nexigon Agent and CLI ${TAG#v}" \
              --notes-file "$NOTES"
          fi
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            build/release/* --clobber
