# spellchecker:ignore taiki dtolnay Taplo xvzf musleabihf gnueabihf msvc clippy bindgen

name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Download link for the `cargo-deny` binary to use.
  CARGO_DENY_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.0/cargo-deny-0.19.0-x86_64-unknown-linux-musl.tar.gz
  # Download link for the `sidex` binary to use.
  SIDEX_URL: https://github.com/silitics/sidex/releases/download/v0.2.6/sidex-x86_64-unknown-linux-musl.tar.gz
  # Download link for the `cross` binary to use.
  CROSS_URL: https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-11
          components: rustfmt, clippy
      - name: Install Taplo
        uses: dtolnay/install@taplo-cli
      - name: Install Cargo Deny
        run: curl -s -L "$CARGO_DENY_URL" | tar xvzf - -C /usr/local/bin --strip-components=1 --wildcards --no-anchored 'cargo-deny'
      - name: Install Sidex
        run: curl -fsSL "$SIDEX_URL" | tar xzf - -C /usr/local/bin sidex
      - name: Run Checks
        run: |
          bash -n installer/*.sh
          bash -n scripts/*.sh
          installer/test-install-hub.sh
          cargo deny check
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          taplo fmt --check
          for directory in \
            crates/libs/nexigon-api \
            crates/libs/nexigon-agent-api \
            crates/libs/nexigon-agent-protocol \
            crates/apps/nexigon-cli \
            crates/apps/nexigon-agent; do
              (cd "$directory" && sidex fmt --check && sidex check)
          done
  test:
    name: Test
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          # FIXME: Fails to compile due to `aws-lc-rs` missing bindgen.
          # - os: ubuntu-latest
          #   target: arm-unknown-linux-musleabihf
          #   cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: true
          # FIXME: Fails to compile due to `aws-lc-rs` missing bindgen.
          # - os: ubuntu-latest
          #   target: arm-unknown-linux-gnueabihf
          #   cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.cross }}
        with:
          target: ${{ matrix.target }}
      - name: Install Cross
        if: ${{ matrix.cross }}
        run: curl -s -L "$CROSS_URL" | tar xvzf - -C /usr/local/bin
      - name: Determine Version
        run: echo "NEXIGON_GIT_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - name: Run Build
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          if [ "${{ matrix.cross }}" == "true" ]; then
              cross build --locked --release --bins --target "$TARGET"
          else
              cargo build --locked --release --bins --target "$TARGET"
          fi
          mkdir -p build/binaries
          shopt -s extglob
          cd "target/$TARGET/release"
          tar -czf "../../../build/binaries/$TARGET.tar.gz" nexigon-+([a-z])?(.exe)
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries/${{ matrix.target }}.tar.gz
          if-no-files-found: error
  upload:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: build/binaries
          merge-multiple: true
      - name: Upload Binaries
        env:
          NEXIGON_TOKEN: ${{ secrets.NEXIGON_TOKEN }}
          NEXIGON_HUB_URL: ${{ secrets.NEXIGON_HUB_URL }}
        run: |
          tar -xvf build/binaries/x86_64-unknown-linux-gnu.tar.gz nexigon-cli
          export NEXIGON_CLI="./nexigon-cli"
          cat <<EOF >.nexigon-cli.toml
            hub-url = "$NEXIGON_HUB_URL"
            token = "$NEXIGON_TOKEN"
          EOF
          ./scripts/upload-binaries.sh
  build_debs:
    name: Build Debian Packages (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries
      - name: Extract Binaries
        run: |
          set -euo pipefail
          cd build/binaries
          mkdir -p ${{ matrix.target }}
          tar -xzf ${{ matrix.target }}.tar.gz -C ${{ matrix.target }}
          rm -f ${{ matrix.target }}.tar.gz
      - name: Build Debian Packages
        run: ./scripts/build-debs.sh ${{ matrix.target }}
      - name: Upload Debian Packages
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.target }}
          path: build/debs/*.deb
          if-no-files-found: error
  build_source_package:
    name: Build Debian Source Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Build Source Package
        run: ./scripts/build-source-package.sh
      - name: Upload Source Package
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: build/source/*
          if-no-files-found: error
  release_assets:
    name: Create Release
    needs:
      - build
      - build_debs
      - build_source_package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: build/binaries
          merge-multiple: true
      - name: Download Debian Packages
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: build/debs
          merge-multiple: true
      - name: Download Source Package
        uses: actions/download-artifact@v4
        with:
          name: source-package
          path: build/source
      - name: Prepare Release Assets
        run: |
          mkdir -p build/release
          cp build/binaries/* build/debs/* build/source/* build/release/
          ./scripts/prepare-release-assets.sh build/release
          find build/release -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="releases/$TAG.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" \
              --verify-tag \
              --latest \
              --title "Nexigon Agent and CLI ${TAG#v}" \
              --notes-file "$NOTES"
          fi
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            build/release/* --clobber
